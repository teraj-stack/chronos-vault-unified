<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zmiana nazwy projektu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f5f8;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", sans-serif;
      padding: 20px;
    }
    form {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #f59e0b; }
    button {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    #msg {
      position: fixed;
      bottom: 24px;
      font-size: 13px;
      color: #059669;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <form id="f">
    <input id="name" type="text" placeholder="Wpisz nową nazwę projektu..." value="Chronos Vault" autofocus />
    <button type="submit">Zapisz</button>
  </form>
  <div id="msg"></div>
  <script>
    const input = document.getElementById('name');
    const saved = localStorage.getItem('chronos_custom_project_name');
    if (saved) input.value = saved;
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;
      localStorage.setItem('chronos_custom_project_name', val);
      document.title = val;
      document.getElementById('msg').textContent = 'Zapisano: ' + val;
    });
  </script>
</body>
</html>
